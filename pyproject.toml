[project]
name = "matilda-client"
version = "0.1.0"
description = "Python client library for Matilda Platform Gateway API (Party and ServiceUsers endpoints)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Odense RPA / WannabeMatilda Contributors" }
]
keywords = ["matilda", "matildaplatform", "client", "api", "rpa", "service-users", "parties"]

dependencies = [
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "python-dotenv>=1.0.1",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/matilda_client",
    "/README.md",
    "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["matilda_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
exclude = [
    "temp-nexus-client",
    ".venv",
]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
